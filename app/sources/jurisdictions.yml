# Where a person is, and which authority that puts them in front of.
#
# Immigration procedure in France is national law administered locally. The
# rule comes from the ministry; the counter, the appointment system and the
# list of papers that counter actually wants come from a préfecture. Answering
# only from the national page is how someone arrives with the wrong folder.
#
# `cities` is not a gazetteer. It is the communes a reader is likely to name
# when they say where they live, and it exists so "I live in Antibes"
# resolves without asking them for a département number they may not know.
#
# `prefecture_source` is the important column, and it is mostly empty on
# purpose. A département is listed here as geography — code, name, region and
# principal communes are stable public facts. A `prefecture_source` is a
# promise that a specific page was fetched, parsed and registered, and only
# the five that were live-verified carry one. Knowing where Antibes is, and
# having read the Alpes-Maritimes préfecture's own page, are different
# things; conflating them is how a citation gets invented. A reader in a
# département with no registered source is told which préfecture decides and
# that its page is not among the sources here — never handed a guessed URL.
#
# Note Paris: there is no paris.gouv.fr — the Préfecture de police handles it,
# which is exactly the kind of thing a "{department}.gouv.fr" rule would have
# got wrong.

