  - id: service-public
    name: Service-Public
    domain: service-public.gouv.fr
    base_url: https://www.service-public.gouv.fr/
    legacy_domains: [service-public.fr]
    source_type: government
    authority_level: 2
    supported_topics: [residence-permit, housing, documents, work, family, health, taxes]
    language: fr
    refresh_priority: medium
    jurisdiction: national
    health: healthy
    official_site_url: https://www.service-public.gouv.fr/
    verified: true
    verified_at: 2026-09-15
    live_query_enabled: false
    freshness_hours: 720
    notes: >
      The corpus this system is built on, ingested locally from the DILA open
      data publication. Explains procedure across government; rarely the body
      that decides it.

      It passes the live-query gate and is deliberately left off. Reading it
      over the web would re-fetch, one page at a time, material that is
      already indexed here as 43,794 passages — slower, and no more current,
      since the feed is the same publication. Live querying is for bodies the
      corpus cannot speak for.

