# Authoritative sources.
#
# A domain in this file may become evidence in an answer. A domain not in this
# file may not, however official it looks and however confidently a page or a
# reader claims it. Adding one is a deliberate act: name the body, say what it
# is the authority for, and verify it — `python -m app.live_source_check`
# writes the verification date back here.
#
# authority_level 1 = this body decides the rule.
# authority_level 2 = this body explains someone else's rule.
#
# `aliases` are other hostnames that legitimately serve the same source,
# including ones it has moved away from. They are how a rebrand stays
# reachable without a redirect to a new name looking like a hijack.

version: 1

sources:
