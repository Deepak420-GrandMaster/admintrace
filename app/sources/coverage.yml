# Which kinds of authority answer which kind of question.
#
# The ranking is per topic because the right answer to "who decides this"
# genuinely differs. A school's admission rules are the school's. A residence
# permit is national law applied at a préfecture counter, and what that counter
# wants is local. Housing benefit is a national body. One ordering for all of
# them would be wrong for most of them.
#
# `required` is what a complete answer needs. `preferred` is consulted first.
# `fallback` is what to use when nothing better answered — which, for most of
# these, is the general public-administration corpus.

version: 1

topics:
  residence_permit:
    purposes: [residence_permit, documents]
    preferred: [local_authority, government]
    required: [government]
    fallback: [corpus]
    note: National rule, local counter. Both matter; neither alone is enough.

  admission:
    purposes: [admission, programmes, tuition, deadline]
    preferred: [school, university, institution]
    required: [school, university, institution]
    fallback: [public_body]
    note: An institution's own rule. No government page can answer it.

  housing:
    purposes: [housing]
    preferred: [public_body]
    required: [public_body]
    fallback: [corpus]

  health:
    purposes: [health]
    preferred: [public_body]
    required: [public_body]
    fallback: [corpus]

  work:
    purposes: [work]
    preferred: [public_body]
    required: [public_body]
    fallback: [corpus]

  taxes:
    purposes: [taxes]
    preferred: [government]
    required: [government]
    fallback: [corpus]

  identity_documents:
    purposes: [documents]
    preferred: [public_body, local_authority]
    required: [public_body]
    fallback: [corpus]

  study_life:
    purposes: [programmes]
    preferred: [public_body]
    required: [public_body]
    fallback: [corpus]

  public_transport:
    purposes: [public_transport]
    preferred: [local_authority]
    required: [local_authority]
    fallback: []
    note: >
      Fares and free-travel schemes are set by the local transport authority,
      not by the state: a tram in Antibes and a tram in Montpellier are
      different networks under different rules, and there is no national
      answer to average them into. `fallback` is empty on purpose — the
      public-administration corpus has pages that share this vocabulary
      (senior travel in Paris, RSA entitlements) and none of them answers
      "is my tram free in Antibes". A source gap stated plainly is worth
      more than an official page about somebody else.
