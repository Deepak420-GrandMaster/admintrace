meta:
  version: 1
  language_pair: [en, fr]
  note: >
    Seed set collected from Campus France, ameli forums, CAF guides, expat and
    relocation sites, tenant guides and impots.gouv.fr. expected_fiche_id is
    filled in after the first ingestion run, never guessed.

