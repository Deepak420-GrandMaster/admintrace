[project]
name = "admintrace"
version = "0.1.0"
description = "Official-source AI for navigating French administration."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.13"

dependencies = [
    "chromadb>=0.5.0",     # embedded vector store, local folder, no server
    "gradio>=4.44.0",      # localhost UI
    "ollama>=0.3.0",       # local inference client (embeddings + chat)
    "rank-bm25>=0.2.2",    # in-process keyword search
    "python-dotenv>=1.0.0",# .env loading, consumed only by app/config.py
    "pyyaml>=6.0",         # eval/questions.yaml
    "sentence-transformers>=6.0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Rendering is opt-in. Most official sites serve their content in the HTML and
# need none of this; a few state services are browser-rendered applications
# and cannot be read without it. Installing a browser should be the reader's
# decision, not a cost every install pays.
render = ["playwright>=1.44"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "network: reaches the live web. Skipped unless ADMINTRACE_NETWORK_TESTS=1, so the\n    default suite stays offline, fast and immune to someone else's outage.",
    "needs_answers: a browser test that needs a working model provider to produce an answer. Skipped as NOT CONFIGURED when ADMINTRACE_BROWSER_ANSWERS=0.",
    "needs_corpus: a browser test that needs the locally built corpus (data/chroma). Skipped as NOT CONFIGURED when ADMINTRACE_BROWSER_CORPUS=0.",
]
